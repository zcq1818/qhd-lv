<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营后台 | 秦皇岛旅游官网</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
:root{--brand:#1a73e8;--ink:#0f172a;--muted:#64748b;--line:#e5e7eb;--bg:#f6f8fb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--brand)}

/* 登录 */
/* hidden 属性的默认 display:none 来自 UA 样式表,任何作者样式都能压过它 ——
   #gate{display:flex} 和 header{display:flex} 就是这样,导致登录成功后
   遮罩关不掉、顶栏在登录前就冒出来。这条兜底必须留着。 */
[hidden]{display:none!important}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0b1f3a,#123c6e);z-index:100;padding:20px}
#gate .box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#gate h1{margin:0 0 6px;font-size:1.3rem}
#gate p{margin:0 0 20px;color:var(--muted);font-size:.9rem}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
#gate .pass-row{display:flex;gap:8px;margin-bottom:12px}
#gate .pass-row button{width:auto;flex:0 0 auto;padding:0 14px;background:#eef2f7;color:#475569;font-weight:600;font-size:13px}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
#gate .err{color:#dc2626;font-size:.85rem;margin-top:10px;display:none}

header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:1.1rem;font-weight:800}
header .spacer{flex:1}
header button{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.85rem;font-weight:700;cursor:pointer}
header button:hover{border-color:var(--brand);color:var(--brand)}

.wrap{max-width:1100px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.9rem;font-weight:700;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card .n{font-size:1.9rem;font-weight:900;line-height:1.2}
.card .l{font-size:.8rem;color:var(--muted);margin-top:2px}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel h2{margin:0;padding:16px 20px;font-size:1rem;border-bottom:1px solid var(--line);background:#fafbfd}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

.lead{padding:18px 20px;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.lead-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.lead-name{font-weight:800;font-size:1.02rem}
.lead-contact{font-weight:700;color:var(--brand);cursor:pointer;border-bottom:1px dashed var(--brand)}
.lead-time{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.lead-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lead-meta span{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:#475569}
.lead-note{color:#475569;font-size:.9rem;background:#fffbeb;border-radius:8px;padding:10px 12px;margin-top:6px}
.lead-src{font-size:.75rem;color:#94a3b8;margin-top:8px}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 20px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#fafbfd;font-size:.8rem;color:var(--muted);font-weight:700}
td.n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfd}
.bar{height:6px;background:var(--brand);border-radius:3px;min-width:2px}

.lead.done{opacity:.55}
.lead-badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:700;margin-left:2px}
.lead-badge.new{background:#fee2e2;color:#b91c1c}
.lead-badge.done{background:#dcfce7;color:#15803d}
.lead-act{float:right;display:flex;gap:10px}
.lead-act button{border:0;background:none;font-size:.8rem;cursor:pointer;padding:0 2px}
.lead-mark{color:#1d4ed8}
.lead-mark:hover,.lead-del:hover{text-decoration:underline}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:.85rem;cursor:pointer}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
#notifyTip{font-size:.85rem;line-height:1.5}
#notifyTip.ok{color:#15803d}
#notifyTip.bad{color:#b91c1c}
.lead-del{float:right;border:0;background:none;color:#b91c1c;font-size:.8rem;cursor:pointer;padding:0 2px}
.lead-del:hover{text-decoration:underline}
.note{margin-top:18px;font-size:.85rem;color:var(--muted);line-height:1.8}
@media(max-width:600px){.wrap{padding:14px}th,td{padding:9px 12px}.lead{padding:14px}}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>运营后台</h1>
    <p>输入后台口令查看询价线索与页面热度</p>
    <div class="pass-row">
      <input type="password" id="pass" placeholder="口令" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="peek" title="显示口令">显示</button>
    </div>
    <button id="loginBtn">进入</button>
    <div class="err" id="err"></div>
  </div>
</div>

<header hidden id="bar">
  <h1>运营后台</h1>
  <span class="spacer"></span>
  <button id="refreshBtn">刷新</button>
  <button id="exportBtn">导出线索 CSV</button>
  <button id="notifyBtn">测试微信推送</button>
  <span id="notifyTip" hidden></span>
  <button id="logoutBtn">退出</button>
</header>

<div class="wrap" hidden id="main">
  <div class="tabs">
    <button class="tab on" data-tab="leads">询价线索</button>
    <button class="tab" data-tab="views">页面热度</button>
  </div>

  <section id="tabLeads">
    <div class="cards" id="leadCards"></div>
    <div class="panel">
      <h2>最近的询价</h2>
      <div class="filters">
        <button data-filter="all" class="on">全部</button>
        <button data-filter="new">未处理</button>
        <button data-filter="done">已处理</button>
      </div>
      <div id="leadList"><div class="empty">加载中…</div></div>
    </div>
    <p class="note">线索保存 400 天。点联系方式可复制。来源 spot- 开头是景点页,itinerary 是行程规划页,accommodation 是住宿页,local-guide 是当地向导页。</p>
  </section>

  <section id="tabViews" hidden>
    <div class="cards" id="viewCards"></div>
    <div class="panel">
      <h2>转化漏斗</h2>
      <div id="funnel"><div class="empty">加载中…</div></div>
    </div>
    <div class="panel">
      <h2>页面热度排行</h2>
      <div id="viewList"><div class="empty">加载中…</div></div>
    </div>
    <p class="note">spot- 开头是景点页,en- 是英文页,page- 是栏目页,其余是博客。招商谈价时可以直接引用这里的单页数据。<br>漏斗按「同一次会话每种只记一次」统计,所以是人数不是次数。</p>
  </section>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'qhd-admin-key';
  var key = sessionStorage.getItem(KEY) || '';
  var gate = document.getElementById('gate');
  var err = document.getElementById('err');
  var leadsCache = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fmtTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function daysAgo(iso, n) { return Date.now() - new Date(iso).getTime() <= n * 86400000; }

  function show() {
    gate.hidden = true;
    document.getElementById('bar').hidden = false;
    document.getElementById('main').hidden = false;
  }

  function fail(msg) {
    err.innerHTML = msg;
    err.style.display = 'block';
  }

  function login() {
    var btn = document.getElementById('loginBtn');
    var input = document.getElementById('pass');
    var v = (input.value || '').trim();

    // 先给出可见反馈,后面无论走哪条路都会改写它 —— 不允许「点了没反应」
    err.style.display = 'none';
    if (!v) { fail('请先输入口令。'); return; }

    if (location.protocol === 'file:') {
      fail('这个页面是直接从磁盘打开的,后台接口调不通。请通过网址访问:<br>' +
        '<a href="https://www.divdu.com/dashboard">https://www.divdu.com/dashboard</a>');
      return;
    }

    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '验证中…';
    var settled = false;
    var done = function () { btn.disabled = false; btn.textContent = original; };

    // 请求再怎么卡也不能让按钮一直转:15 秒没结果就认定超时
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      if (ctrl) ctrl.abort();
      done();
      fail('接口 15 秒没有响应。数据库那边可能没连上 —— ' +
        '可以先打开 <a href="/api/leads?ping=1" target="_blank">/api/leads?ping=1</a> 看一眼,' +
        '它会直接告诉你读取通不通。');
    }, 15000);

    try {
      fetch('/api/leads?stat=1', { headers: { 'X-Admin-Key': v }, signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) {
          return r.text().then(function (t) {
            var d = null;
            try { d = JSON.parse(t); } catch (e) { /* 不是 JSON,下面按状态码报 */ }
            return { status: r.status, data: d, raw: t };
          });
        })
        .then(function (res) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (res.data && res.data.ok) {
            key = v;
            try { sessionStorage.setItem(KEY, v); } catch (e) { /* 无痕模式下存不了,不影响本次 */ }
            show();
            loadAll();
            return;
          }
          done();
          if (res.data && res.data.error === 'ADMIN_KEY_NOT_SET') {
            fail('后台口令尚未配置:请在 Vercel 环境变量中添加 LEADS_ADMIN_KEY,并重新部署一次。');
          } else if (res.data && res.data.error) {
            fail('口令不正确。请确认与 Vercel 环境变量 LEADS_ADMIN_KEY 完全一致;' +
              '改过环境变量后需要重新部署一次才生效。');
          } else {
            // 接口没返回预期的 JSON —— 把状态码显示出来,方便定位
            fail('接口返回异常(HTTP ' + res.status + ')。' +
              (res.status === 404 ? ' 看起来 /api/leads 还没部署上去。' : '') +
              '<br><span style="color:#64748b">' + esc(String(res.raw).slice(0, 120)) + '</span>');
          }
        })
        .catch(function (e) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          done();
          fail('请求没能发出去:' + esc(e && e.message ? e.message : String(e)) +
            '<br><span style="color:#64748b">多半是网络问题或被浏览器扩展拦了。</span>');
        });
    } catch (e) {
      settled = true;
      clearTimeout(timer);
      done();
      fail('页面出错:' + esc(e && e.message ? e.message : String(e)));
    }
  }

  // 能看见框里到底是什么 —— 密码管理器覆盖输入是这类「口令明明对却进不去」的常见原因
  document.getElementById('peek').addEventListener('click', function () {
    var input = document.getElementById('pass');
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    this.textContent = showing ? '显示' : '隐藏';
    input.focus();
  });

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); login(); } });
  document.getElementById('logoutBtn').addEventListener('click', function () { sessionStorage.removeItem(KEY); location.reload(); });
  document.querySelectorAll('.filters button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filters button').forEach(function (x) { x.classList.toggle('on', x === btn); });
      filter = btn.dataset.filter;
      renderLeads();
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', loadAll);

  // 验证微信通知是否接通。走的是不制造假线索的自测入口。
  document.getElementById('notifyBtn').addEventListener('click', function () {
    var btn = this;
    var tip = document.getElementById('notifyTip');
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '发送中…';
    tip.hidden = true;

    fetch('/api/leads?testnotify=1', { headers: { 'X-Admin-Key': key } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false;
        btn.textContent = original;
        tip.hidden = false;
        // Server酱 收下了会在应答里回 "code":0;HTTP 200 不代表它认这个 key
        var accepted = d && d.ok && /"code"\s*:\s*0/.test(d.reply || '');
        if (accepted) {
          tip.className = 'ok';
          tip.textContent = '已发送,看一下微信。';
        } else if (d && d.error) {
          tip.className = 'bad';
          tip.textContent = d.error;
        } else {
          tip.className = 'bad';
          tip.textContent = 'Server酱 没有收下(HTTP ' + (d && d.status) + '):' +
            String((d && d.reply) || '').slice(0, 120);
        }
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = original;
        tip.hidden = false;
        tip.className = 'bad';
        tip.textContent = '请求失败:' + (e && e.message ? e.message : e);
      });
  });

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === t); });
      document.getElementById('tabLeads').hidden = t.dataset.tab !== 'leads';
      document.getElementById('tabViews').hidden = t.dataset.tab !== 'views';
    });
  });

  /* ---------- 线索 ---------- */
  function loadLeads() {
    fetch('/api/leads?limit=200', { headers: { 'X-Admin-Key': key } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error(d && d.error);
        leadsCache = d.leads || [];
        leadsTotal = d.total || leadsCache.length;
        renderFunnel();
        var today = leadsCache.filter(function (l) { return daysAgo(l.createdAt, 1); }).length;
        var week = leadsCache.filter(function (l) { return daysAgo(l.createdAt, 7); }).length;
        var pending = leadsCache.filter(function (l) { return l.status !== 'done'; }).length;
        document.getElementById('leadCards').innerHTML =
          card(pending, '待处理') + card(d.total || 0, '累计线索') +
          card(week, '最近 7 天') + card(today, '最近 24 小时');

        renderLeads();
      })
      .catch(function (e) {
        document.getElementById('leadList').innerHTML =
          '<div class="empty">读取失败:' + esc(e.message || '未知错误') + '</div>';
      });
  }

  /* 单独抽出来:切换筛选时不必重新请求接口 */
  var filter = 'all';

  function renderLeads() {
    var box = document.getElementById('leadList');
    if (!leadsCache.length) {
      box.innerHTML = '<div class="empty">还没有线索。表单已接通,有人提交就会出现在这里。</div>';
      return;
    }

    var rows = leadsCache.filter(function (l) {
      if (filter === 'new') return l.status !== 'done';
      if (filter === 'done') return l.status === 'done';
      return true;
    });

    if (!rows.length) {
      box.innerHTML = '<div class="empty">' +
        (filter === 'new' ? '没有待处理的线索,都回过了。' : '还没有标记为已处理的线索。') + '</div>';
      return;
    }

    box.innerHTML = rows.map(function (l) {
      var done = l.status === 'done';
      var meta = [l.date, l.people, l.service].filter(Boolean)
        .map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
      return '<div class="lead' + (done ? ' done' : '') + '">' +
        '<div class="lead-top">' +
          '<span class="lead-name">' + esc(l.name || '(未留姓名)') + '</span>' +
          '<span class="lead-contact" data-copy="' + esc(l.contact) + '">' + esc(l.contact) + '</span>' +
          '<span class="lead-badge ' + (done ? 'done">已处理' : 'new">待处理') + '</span>' +
          '<span class="lead-time">' + fmtTime(l.createdAt) + '</span>' +
        '</div>' +
        (meta ? '<div class="lead-meta">' + meta + '</div>' : '') +
        (l.note ? '<div class="lead-note">' + esc(l.note) + '</div>' : '') +
        '<div class="lead-src">来自 ' + esc(l.source || '?') + (l.page ? ' · ' + esc(l.page) : '') +
          '<span class="lead-act">' +
            '<button class="lead-mark" data-mark="' + esc(l.id) + '" data-to="' + (done ? 'new' : 'done') + '">' +
              (done ? '恢复待处理' : '标记已处理') + '</button>' +
            '<button class="lead-del" data-del="' + esc(l.id) + '">删除</button>' +
          '</span></div>' +
      '</div>';
    }).join('');

    document.querySelectorAll('[data-mark]').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-mark');
        var to = el.getAttribute('data-to');
        el.disabled = true;
        el.textContent = '处理中…';
        fetch('/api/leads?id=' + encodeURIComponent(id) + '&status=' + to, {
          method: 'PATCH', headers: { 'X-Admin-Key': key }
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || !d.ok) throw new Error(d && d.error);
            // 本地改一下就够了,不用为一次点击把整页数据重拉一遍
            var hit = leadsCache.filter(function (x) { return x.id === id; })[0];
            if (hit) hit.status = to;
            var pending = leadsCache.filter(function (x) { return x.status !== 'done'; }).length;
            var firstCard = document.querySelector('#leadCards .card .n');
            if (firstCard) firstCard.textContent = pending;
            renderLeads();
          })
          .catch(function (e) {
            el.disabled = false;
            el.textContent = '标记失败';
            console.warn(e);
          });
      });
    });

    document.querySelectorAll('[data-del]').forEach(function (el) {
          el.addEventListener('click', function () {
            var id = el.getAttribute('data-del');
            if (!confirm('删除这条线索?删掉就找不回来了。')) return;
            el.disabled = true;
            el.textContent = '删除中…';
            fetch('/api/leads?id=' + encodeURIComponent(id), {
              method: 'DELETE', headers: { 'X-Admin-Key': key }
            })
              .then(function (r) { return r.json(); })
              .then(function (d) {
                if (d && d.ok) loadAll();
                else { el.disabled = false; el.textContent = '删除失败'; }
              })
              .catch(function () { el.disabled = false; el.textContent = '删除失败'; });
          });
        });

        document.querySelectorAll('[data-copy]').forEach(function (el) {
          el.addEventListener('click', function () {
            var v = el.getAttribute('data-copy');
            if (navigator.clipboard) navigator.clipboard.writeText(v);
            var old = el.textContent;
            el.textContent = '已复制';
            setTimeout(function () { el.textContent = old; }, 1200);
          });
        });
  }

  function card(n, l) { return '<div class="card"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }

  /* ---------- 转化漏斗 ----------
     页面浏览量只说明有人来过,不说明有人动心。这里看的是三个动作:
     滚到二维码 → 点了二维码 → 看到咨询框 → 真的提交。
     两条数据来自不同接口(线索数与事件计数),谁先回来都能画,所以
     两边各调一次 renderFunnel。 */
  var events = {};
  var leadsTotal = 0;

  function renderFunnel() {
    var box = document.getElementById('funnel');
    if (!box) return;

    var steps = [
      ['看到微信二维码', events['qr-view'] || 0, '滚动到二维码位置的人数'],
      ['点了二维码', events['qr-tap'] || 0, '点击或长按二维码,多半是去保存/识别'],
      ['看到咨询表单', events['form-view'] || 0, '咨询卡片进入视野的人数'],
      ['提交了咨询', leadsTotal, '真正留下联系方式的人数']
    ];

    if (!steps.some(function (x) { return x[1] > 0; })) {
      box.innerHTML = '<div class="empty">还没有数据。访客访问带二维码或咨询表单的页面后,这里会出现。</div>';
      return;
    }

    var max = Math.max.apply(null, steps.map(function (x) { return x[1]; })) || 1;
    var seen = events['form-view'] || 0;
    var rate = seen ? (leadsTotal / seen * 100) : 0;

    box.innerHTML =
      '<table><thead><tr><th>动作</th><th style="width:40%">相对人数</th><th class="n">人数</th></tr></thead><tbody>' +
      steps.map(function (x) {
        return '<tr><td title="' + esc(x[2]) + '">' + esc(x[0]) + '</td>' +
          '<td><div class="bar" style="width:' + Math.round(x[1] / max * 100) + '%"></div></td>' +
          '<td class="n">' + x[1] + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (seen ? '<p class="note" style="margin-top:12px">看到咨询表单的人里,有 <strong>' +
        rate.toFixed(1) + '%</strong> 提交了。' +
        (rate < 2 ? '这个比例偏低,通常是文案或位置的问题,不是流量不够。' : '') + '</p>' : '');
  }

  /* ---------- 页面热度 ---------- */
  function loadViews() {
    fetch('/api/view-counter?list=1')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var counts = (d && d.counts) || {};
        // event- 开头的是转化动作,不是页面,单独拿出来算漏斗
        events = {};
        var rows = Object.keys(counts).filter(function (k) {
          if (k.indexOf('event-') === 0) { events[k.slice(6)] = counts[k]; return false; }
          return true;
        }).map(function (k) { return [k, counts[k]]; })
          .sort(function (a, b) { return b[1] - a[1]; });
        renderFunnel();
        var total = rows.reduce(function (t, r) { return t + r[1]; }, 0);
        var spots = rows.filter(function (r) { return r[0].indexOf('spot-') === 0; }).length;
        document.getElementById('viewCards').innerHTML =
          card(total, '累计浏览') + card(rows.length, '有数据的页面') + card(spots, '其中景点页');

        if (!rows.length) {
          document.getElementById('viewList').innerHTML = '<div class="empty">还没有数据</div>';
          return;
        }
        var max = rows[0][1] || 1;
        document.getElementById('viewList').innerHTML =
          '<table><thead><tr><th>页面</th><th>类型</th><th style="width:34%">热度</th><th class="n">浏览</th></tr></thead><tbody>' +
          rows.slice(0, 120).map(function (r) {
            var k = r[0], v = r[1];
            var type = k.indexOf('en-spot-') === 0 ? '英文景点'
              : k.indexOf('en-') === 0 ? '英文页'
              : k.indexOf('spot-') === 0 ? '景点页'
              : k.indexOf('page-') === 0 ? '栏目页'
              : k === 'home' ? '首页' : '博客';
            var href = k === 'home' ? '/'
              : k.indexOf('en-spot-') === 0 ? '/en/attraction/' + k.slice(8)
              : k.indexOf('spot-') === 0 ? '/attraction/' + k.slice(5)
              : k.indexOf('en-') === 0 ? '/en/' + k.slice(3)
              : k.indexOf('page-') === 0 ? '/' + k.slice(5)
              : '/blog/' + k;
            return '<tr><td><a href="' + esc(href) + '" target="_blank">' + esc(k) + '</a></td>' +
              '<td>' + type + '</td>' +
              '<td><div class="bar" style="width:' + Math.round(v / max * 100) + '%"></div></td>' +
              '<td class="n">' + v + '</td></tr>';
          }).join('') + '</tbody></table>';
      })
      .catch(function () {
        document.getElementById('viewList').innerHTML = '<div class="empty">读取失败</div>';
      });
  }

  function loadAll() { loadLeads(); loadViews(); }

  /* ---------- 导出 ---------- */
  document.getElementById('exportBtn').addEventListener('click', function () {
    if (!leadsCache.length) return alert('暂无线索可导出');
    var head = ['时间', '姓名', '联系方式', '出行日期', '人数', '意向服务', '备注', '来源', '页面'];
    var q = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
    var csv = '﻿' + head.map(q).join(',') + '\n' + leadsCache.map(function (l) {
      return [fmtTime(l.createdAt), l.name, l.contact, l.date, l.people, l.service, l.note, l.source, l.page].map(q).join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = '询价线索-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });

  if (key) { show(); loadAll(); }
})();
</script>
</body>
</html>
