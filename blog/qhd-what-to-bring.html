<p>去秦皇岛旅游要带什么？这份清单帮你打包行李。</p>

<h2>必备</h2>
<p>身份证、手机、充电宝、防晒霜、泳衣、拖鞋、墨镜、帽子、常用药。</p>

<h2>推荐</h2>
<p>一次性雨衣、塑料袋（装湿衣物）、零食、水、创可贴、晕车药。</p>

<h2>不用带</h2>
<p>帐篷（除非露营）、太多衣服（海边有洗衣店）、太多现金（手机支付到处可用）。</p>
