<p>去秦皇岛穿什么？根据季节不同，穿衣差别很大。</p>

<h2>夏天(6-8月)</h2>
<p>短袖短裤+拖鞋。带一件薄外套，海边晚上凉。泳衣必备。带帽子和墨镜。</p>

<h2>春秋(4-5月/9-10月)</h2>
<p>长袖+薄外套。早晚温差大，带件厚外套备用。运动鞋方便走路。</p>

<h2>冬天(12-2月)</h2>
<p>羽绒服+帽子+手套+围巾。海边风大，体感比内陆冷10度。穿防滑鞋。</p>
