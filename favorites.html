<script>
window.addEventListener('scroll',function(){document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>20);});
document.getElementById('hamburger').addEventListener('click',function(){document.getElementById('navLinks').classList.toggle('open');});
// 移动端：点击导航链接后自动关闭菜单
var _navLinksEl = document.getElementById('navLinks');
if (_navLinksEl) {
  _navLinksEl.addEventListener('click', function (e) {
    if (e.target.tagName === 'A' || e.target.closest('a')) {
      this.classList.remove('open');
    }
  });
}

function clearAllFavorites() {
  if (!confirm('确定要清空所有收藏吗？此操作不可撤销。')) return;
  try {
    localStorage.removeItem('qhd_favorites');
    localStorage.removeItem('qhd_fav_names');
  } catch (e) {}
  if (window.QHDUser) {
    window.QHDUser.renderFavoritesPage();
    window.QHDUser.flashToast('已清空所有收藏');
  }
  document.getElementById('itinPreview').classList.remove('show');
}

function generateItinerary() {
  var favIds = [];
  try { favIds = JSON.parse(localStorage.getItem('qhd_favorites')) || []; } catch (e) {}
  var preview = document.getElementById('itinPreview');
  if (!favIds.length) {
    if (window.QHDUser) window.QHDUser.flashToast('请先收藏景点');
    else alert('请先收藏景点');
    return;
  }
  fetch('data/attractions.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { spots: [], areas: [] }; })
    .catch(function () { return { spots: [], areas: [] }; })
    .then(function (data) {
      var spots = data.spots || [];
      var areas = data.areas || [];
      var favs = spots.filter(function (s) { return favIds.indexOf(s.id) >= 0; });
      if (!favs.length) { preview.classList.remove('show'); return; }
      var groups = {};
      favs.forEach(function (s) { (groups[s.area] = groups[s.area] || []).push(s); });
      var areaOrder = areas.map(function (a) { return a.id; });
      var html = '';
      var day = 0;
      areaOrder.forEach(function (areaId) {
        if (!groups[areaId]) return;
        day++;
        var area = areas.find(function (a) { return a.id === areaId; });
        var areaName = area ? area.name : areaId;
        html += '<div class="itin-day"><h3>Day ' + day + ' · ' + areaName + '</h3><div class="itin-spots">' +
          groups[areaId].map(function (s) {
            return '<a class="itin-spot" href="attraction/' + s.id + '">' + s.name + '</a>';
          }).join('') +
        '</div></div>';
      });
      preview.innerHTML = html;
      preview.classList.add('show');
      preview.scrollIntoView({ behavior: 'smooth' });
    });
}
</script>
