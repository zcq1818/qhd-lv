<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">

<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}

<body>
<div class="slide-container" style="background:linear-gradient(135deg,#0c4a6e 0%,#0369a1 40%,#0ea5e9 70%,#38bdf8 100%);">
  <div style="position:relative;z-index:2;padding:80px 100px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
    <h1 style="font-size:52px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:20px;">开始你的秦皇岛之旅</h1>
    <div style="width:80px;height:4px;background:#fcd34d;margin-bottom:30px;border-radius:2px;"></div>
    <p style="font-size:22px;color:rgba(255,255,255,0.9);max-width:600px;line-height:1.8;margin-bottom:40px;">
      北戴河看海 · 山海关登长城 · 鸽子窝看日出<br>
      3-5天，人均1500-3000元，尽享海滨度假
    </p>
    <div style="display:flex;gap:24px;margin-bottom:50px;">
      <div style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);padding:16px 28px;border-radius:12px;">
        <div style="font-size:28px;font-weight:900;color:#fcd34d;">3-5天</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px;">建议游玩天数</div>
      </div>
      <div style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);padding:16px 28px;border-radius:12px;">
        <div style="font-size:28px;font-weight:900;color:#fcd34d;">1500-3000</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px;">人均费用（元）</div>
      </div>
      <div style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);padding:16px 28px;border-radius:12px;">
        <div style="font-size:28px;font-weight:900;color:#fcd34d;">5-10月</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px;">最佳旅游季节</div>
      </div>
    </div>
    <div style="color:rgba(255,255,255,0.5);font-size:14px;">
      更多攻略请访问：www.divdu.com
