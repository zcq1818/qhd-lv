<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="slide-container" style="background:#fff;padding:50px 80px;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <span style="background:#0ea5e9;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">06</span>
    <span style="font-size:14px;color:#0ea5e9;font-weight:700;letter-spacing:2px;">TRANSPORTATION</span>
  </div>
  <h1 style="font-size:36px;font-weight:900;color:#0f172a;margin-bottom:28px;">交通指南</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;">
    <div>
      <h3 style="font-size:18px;font-weight:700;color:#0369a1;margin-bottom:16px;"><i class="fas fa-train" style="margin-right:8px;"></i>高铁（推荐）</h3>
      <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:24px;">
        <tr style="background:#f0f9ff;"><th style="padding:10px 14px;text-align:left;border-bottom:1px solid #e2e8f0;">出发地</th><th style="padding:10px 14px;text-align:center;border-bottom:1px solid #e2e8f0;">时间</th><th style="padding:10px 14px;text-align:center;border-bottom:1px solid #e2e8f0;">票价</th></tr>
        <tr><td style="padding:10px 14px;border-bottom:1px solid #f1f5f9;">北京</td><td style="padding:10px 14px;text-align:center;border-bottom:1px solid #f1f5f9;">约2小时</td><td style="padding:10px 14px;text-align:center;border-bottom:1px solid #f1f5f9;">约150元</td></tr>
        <tr style="background:#f8fafc;"><td style="padding:10px 14px;border-bottom:1px solid #f1f5f9;">天津</td><td style="padding:10px 14px;text-align:center;border-bottom:1px solid #f1f5f9;">约1.5小时</td><td style="padding:10px 14px;text-align:center;border-bottom:1px solid #f1f5f9;">约100元</td></tr>
        <tr><td style="padding:10px 14px;">沈阳</td><td style="padding:10px 14px;text-align:center;">约3小时</td><td style="padding:10px 14px;text-align:center;">约200元</td></tr>
      </table>
      <div style="padding:12px 16px;background:#fef3c7;border-radius:8px;font-size:13px;color:#92400e;">
        <strong>选站提示：</strong>去北戴河选「北戴河站」，去山海关选「秦皇岛站」
      </div>
    </div>
    <div>
      <h3 style="font-size:18px;font-weight:700;color:#0369a1;margin-bottom:16px;"><i class="fas fa-car" style="margin-right:8px;"></i>自驾</h3>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;">
        <div style="padding:12px 16px;background:#f0f9ff;border-radius:8px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">北京出发</div>
          <div style="font-size:12px;color:#64748b;">京哈高速(G1) · 300公里 · 3-4小时 · 高速费约120元</div>
        </div>
        <div style="padding:12px 16px;background:#f0f9ff;border-radius:8px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">天津出发</div>
          <div style="font-size:12px;color:#64748b;">沿海高速 · 250公里 · 2.5-3小时 · 高速费约100元</div>
        </div>
      </div>
      <h3 style="font-size:18px;font-weight:700;color:#0369a1;margin-bottom:16px;"><i class="fas fa-bus" style="margin-right:8px;"></i>市内交通</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;justify-content:space-between;padding:10px 16px;background:#f8fafc;border-radius:6px;font-size:14px;">
          <span>公交</span><span style="font-weight:700;color:#0369a1;">1-2元</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:10px 16px;background:#f8fafc;border-radius:6px;font-size:14px;">
          <span>打车起步价</span><span style="font-weight:700;color:#0369a1;">7元</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:10px 16px;background:#f8fafc;border-radius:6px;font-size:14px;">
          <span>景区停车</span><span style="font-weight:700;color:#0369a1;">10-20元/次</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
