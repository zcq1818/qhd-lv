<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="slide-container" style="background:#fff;padding:50px 80px;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <span style="background:#0ea5e9;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">04</span>
    <span style="font-size:14px;color:#0ea5e9;font-weight:700;letter-spacing:2px;">FOOD RECOMMENDATIONS</span>
  </div>
  <h1 style="font-size:36px;font-weight:900;color:#0f172a;margin-bottom:28px;">美食推荐</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;">
    <div>
      <h3 style="font-size:18px;font-weight:700;color:#0369a1;margin-bottom:16px;"><i class="fas fa-fish" style="margin-right:8px;"></i>海鲜必吃</h3>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f0f9ff;border-radius:8px;">
          <span style="font-size:20px;">🦐</span>
          <div><div style="font-weight:700;font-size:15px;">皮皮虾</div><div style="font-size:12px;color:#64748b;">椒盐最经典 · 30-50元/斤</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f0f9ff;border-radius:8px;">
          <span style="font-size:20px;">🦀</span>
          <div><div style="font-weight:700;font-size:15px;">螃蟹</div><div style="font-size:12px;color:#64748b;">清蒸最好吃 · 50-80元/斤</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f0f9ff;border-radius:8px;">
          <span style="font-size:20px;">🦪</span>
          <div><div style="font-weight:700;font-size:15px;">扇贝/生蚝</div><div style="font-size:12px;color:#64748b;">蒜蓉粉丝蒸 · 10元3个</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#f0f9ff;border-radius:8px;">
          <span style="font-size:20px;">🥟</span>
          <div><div style="font-weight:700;font-size:15px;">海鲜饺子</div><div style="font-size:12px;color:#64748b;">鲅鱼饺子 · 皮薄馅大</div></div>
        </div>
      </div>
    </div>
    <div>
      <h3 style="font-size:18px;font-weight:700;color:#92400e;margin-bottom:16px;"><i class="fas fa-utensils" style="margin-right:8px;"></i>特色小吃</h3>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fef3c7;border-radius:8px;">
          <span style="font-size:20px;">🥟</span>
          <div><div style="font-weight:700;font-size:15px;">四条包子</div><div style="font-size:12px;color:#64748b;">百年老店 · 2-3元/个</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fef3c7;border-radius:8px;">
          <span style="font-size:20px;">🍢</span>
          <div><div style="font-weight:700;font-size:15px;">烤大虾</div><div style="font-size:12px;color:#64748b;">夜市必吃 · 孜然辣椒</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fef3c7;border-radius:8px;">
          <span style="font-size:20px;">🫔</span>
          <div><div style="font-weight:700;font-size:15px;">长城饽椤饼</div><div style="font-size:12px;color:#64748b;">山海关特色 · 清香</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fef3c7;border-radius:8px;">
          <span style="font-size:20px;">🌭</span>
          <div><div style="font-weight:700;font-size:15px;">杨肠子</div><div style="font-size:12px;color:#64748b;">百年香肠 · 伴手礼</div></div>
        </div>
      </div>
    </div>
  </div>
  <div style="margin-top:24px;padding:14px 20px;background:#dcfce7;border-radius:8px;font-size:14px;color:#166534;">
    <i class="fas fa-map-marker-alt" style="margin-right:8px;"></i><strong>美食街推荐：</strong>秦皇小巷（推荐）· 燕大小吃街/公富庄夜市（最便宜，本地人去）· 刘庄夜市（不推荐，坑游客）
  </div>
</div>
<script src="js/weather-widget.js" defer></script>
</body>
</html>
