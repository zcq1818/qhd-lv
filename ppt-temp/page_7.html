<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="slide-container" style="background:#fff;padding:50px 80px;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <span style="background:#dc2626;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">05</span>
    <span style="font-size:14px;color:#dc2626;font-weight:700;letter-spacing:2px;">PITFALL GUIDE</span>
  </div>
  <h1 style="font-size:36px;font-weight:900;color:#0f172a;margin-bottom:28px;">避坑指南</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;">
    <div>
      <h3 style="font-size:18px;font-weight:700;color:#dc2626;margin-bottom:16px;"><i class="fas fa-times-circle" style="margin-right:8px;"></i>常见陷阱</h3>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="padding:14px 18px;background:#fef2f2;border-radius:8px;border-left:4px solid #dc2626;">
          <div style="font-weight:700;font-size:15px;color:#991b1b;margin-bottom:4px;">景区门口吃饭</div>
          <div style="font-size:13px;color:#7f1d1d;">贵且难吃，比市区贵2-3倍</div>
        </div>
        <div style="padding:14px 18px;background:#fef2f2;border-radius:8px;border-left:4px solid #dc2626;">
          <div style="font-weight:700;font-size:15px;color:#991b1b;margin-bottom:4px;">黑车/黑导游</div>
          <div style="font-size:13px;color:#7f1d1d;">价格虚高，服务无保障</div>
        </div>
        <div style="padding:14px 18px;background:#fef2f2;border-radius:8px;border-left:4px solid #dc2626;">
          <div style="font-weight:700;font-size:15px;color:#991b1b;margin-bottom:4px;">景区商店买特产</div>
          <div style="font-size:13px;color:#7f1d1d;">比超市贵3-5倍</div>
        </div>
        <div style="padding:14px 18px;background:#fef2f2;border-radius:8px;border-left:4px solid #dc2626;">
          <div style="font-weight:700;font-size:15px;color:#991b1b;margin-bottom:4px;">临时订住宿</div>
          <div style="font-size:13px;color:#7f1d1d;">旺季涨价2-3倍，还订不到</div>
        </div>
        <div style="padding:14px 18px;background:#fef2f2;border-radius:8px;border-left:4px solid #dc2626;">
          <div style="font-weight:700;font-size:15px;color:#991b1b;margin-bottom:4px;">低价团/购物团</div>
          <div style="font-size:13px;color:#7f1d1d;">表面便宜，实际强制消费</div>
        </div>
      </div>
    </div>
    <div>
      <h3 style="font-size:18px;font-weight:700;color:#16a34a;margin-bottom:16px;"><i class="fas fa-check-circle" style="margin-right:8px;"></i>正确做法</h3>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="padding:14px 18px;background:#f0fdf4;border-radius:8px;border-left:4px solid #16a34a;">
          <div style="font-weight:700;font-size:15px;color:#166534;margin-bottom:4px;">市场买+加工</div>
          <div style="font-size:13px;color:#14532d;">海鲜市场自己买，找店加工最便宜</div>
        </div>
        <div style="padding:14px 18px;background:#f0fdf4;border-radius:8px;border-left:4px solid #16a34a;">
          <div style="font-weight:700;font-size:15px;color:#166534;margin-bottom:4px;">用打车软件</div>
          <div style="font-size:13px;color:#14532d;">滴滴/高德，价格透明有保障</div>
        </div>
        <div style="padding:14px 18px;background:#f0fdf4;border-radius:8px;border-left:4px solid #16a34a;">
          <div style="font-weight:700;font-size:15px;color:#166534;margin-bottom:4px;">超市买特产</div>
          <div style="font-size:13px;color:#14532d;">比景区商店便宜3-5倍</div>
        </div>
        <div style="padding:14px 18px;background:#f0fdf4;border-radius:8px;border-left:4px solid #16a34a;">
          <div style="font-weight:700;font-size:15px;color:#166534;margin-bottom:4px;">提前1-2月订房</div>
          <div style="font-size:13px;color:#14532d;">旺季提前订，价格更便宜</div>
        </div>
        <div style="padding:14px 18px;background:#f0fdf4;border-radius:8px;border-left:4px solid #16a34a;">
          <div style="font-weight:700;font-size:15px;color:#166534;margin-bottom:4px;">问民宿老板</div>
          <div style="font-size:13px;color:#14532d;">他们知道哪家好吃又便宜</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/weather-widget.js" defer></script>
</body>
</html>
