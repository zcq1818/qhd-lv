<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="slide-container" style="background:#fff;">
  <div style="padding:50px 80px;height:720px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
      <span style="background:#0ea5e9;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">01</span>
      <span style="font-size:14px;color:#0ea5e9;font-weight:700;text-transform:uppercase;letter-spacing:2px;">OVERVIEW</span>
    </div>
    <h1 style="font-size:36px;font-weight:900;color:#0f172a;margin-bottom:32px;">城市概览</h1>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;">
      <!-- 左侧：简介 -->
      <div>
        <p style="font-size:17px;color:#334155;line-height:1.9;margin-bottom:24px;">
          秦皇岛位于河北省东北部，是中国著名的滨海旅游城市。北戴河、山海关、南戴河、黄金海岸四大旅游区各具特色，每年吸引超2000万游客。
        </p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div style="background:#f0f9ff;padding:20px;border-radius:12px;border-left:4px solid #0ea5e9;">
            <div style="font-size:28px;font-weight:900;color:#0369a1;">2000万+</div>
            <div style="font-size:13px;color:#64748b;margin-top:4px;">年游客量</div>
          </div>
          <div style="background:#f0f9ff;padding:20px;border-radius:12px;border-left:4px solid #0ea5e9;">
            <div style="font-size:28px;font-weight:900;color:#0369a1;">600年</div>
            <div style="font-size:13px;color:#64748b;margin-top:4px;">山海关历史</div>
          </div>
          <div style="background:#f0f9ff;padding:20px;border-radius:12px;border-left:4px solid #0ea5e9;">
            <div style="font-size:28px;font-weight:900;color:#0369a1;">30+</div>
            <div style="font-size:13px;color:#64748b;margin-top:4px;">景区数量</div>
          </div>
          <div style="background:#f0f9ff;padding:20px;border-radius:12px;border-left:4px solid #0ea5e9;">
            <div style="font-size:28px;font-weight:900;color:#0369a1;">162km</div>
            <div style="font-size:13px;color:#64748b;margin-top:4px;">海岸线长度</div>
          </div>
        </div>
      </div>
      
      <!-- 右侧：四大旅游区 -->
      <div>
        <h3 style="font-size:18px;font-weight:700;color:#0f172a;margin-bottom:20px;">四大旅游区</h3>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div style="background:linear-gradient(90deg,#0c4a6e,#0369a1);padding:18px 24px;border-radius:10px;color:#fff;">
            <div style="font-weight:800;font-size:17px;margin-bottom:4px;">北戴河</div>
            <div style="font-size:13px;opacity:0.8;">看海·赶海·日出·避暑胜地</div>
          </div>
          <div style="background:linear-gradient(90deg,#92400e,#d97706);padding:18px 24px;border-radius:10px;color:#fff;">
            <div style="font-weight:800;font-size:17px;margin-bottom:4px;">山海关</div>
            <div style="font-size:13px;opacity:0.8;">天下第一关·长城入海·古城</div>
          </div>
          <div style="background:linear-gradient(90deg,#166534,#16a34a);padding:18px 24px;border-radius:10px;color:#fff;">
            <div style="font-weight:800;font-size:17px;margin-bottom:4px;">南戴河</div>
            <div style="font-size:13px;opacity:0.8;">游乐场·水上乐园·滑沙</div>
          </div>
          <div style="background:linear-gradient(90deg,#7c2d12,#ea580c);padding:18px 24px;border-radius:10px;color:#fff;">
            <div style="font-weight:800;font-size:17px;margin-bottom:4px;">黄金海岸</div>
            <div style="font-size:13px;opacity:0.8;">阿那亚·渔岛·文艺度假</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/weather-widget.js" defer></script>
</body>
</html>
