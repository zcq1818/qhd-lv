<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
.slide-container h1,.slide-container h2,.slide-container h3,.slide-container p,.slide-container span{margin:0;padding:0}
</style>
</head>
<body>
<div class="slide-container" style="background:linear-gradient(135deg,#0c4a6e 0%,#0369a1 40%,#0ea5e9 70%,#38bdf8 100%);">
  <div style="position:absolute;top:0;left:0;width:400px;height:720px;background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,rgba(255,255,255,0.02) 100%);"></div>
  <div style="position:relative;z-index:2;padding:80px 100px;height:100%;display:flex;flex-direction:column;justify-content:center;">
    <div style="margin-bottom:24px;">
      <span style="display:inline-block;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);padding:8px 24px;border-radius:24px;color:#fff;font-size:16px;font-weight:600;">
        <i class="fas fa-umbrella-beach" style="margin-right:8px;"></i>2026最新攻略
      </span>
    </div>
    <h1 style="font-size:64px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:-1px;margin-bottom:20px;">秦皇岛旅游全攻略</h1>
    <p style="font-size:28px;color:rgba(255,255,255,0.9);font-weight:300;margin-bottom:40px;line-height:1.5;">北戴河看海 · 山海关登长城 · 鸽子窝看日出</p>
    <div style="width:80px;height:4px;background:#fcd34d;margin-bottom:40px;border-radius:2px;"></div>
    <div style="display:flex;gap:16px;">
      <span style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:10px 20px;border-radius:8px;color:#fff;font-size:15px;"><i class="fas fa-map-marker-alt" style="margin-right:8px;color:#fcd34d;"></i>河北省秦皇岛市</span>
      <span style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:10px 20px;border-radius:8px;color:#fff;font-size:15px;"><i class="fas fa-calendar" style="margin-right:8px;color:#fcd34d;"></i>最佳季节：5-10月</span>
      <span style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:10px 20px;border-radius:8px;color:#fff;font-size:15px;"><i class="fas fa-clock" style="margin-right:8px;color:#fcd34d;"></i>建议游玩：3-5天</span>
    </div>
  </div>
  <div style="position:absolute;bottom:40px;right:60px;color:rgba(255,255,255,0.5);font-size:14px;">秦皇岛旅游官网 · www.divdu.com</div>
</div>
</body>
</html>
