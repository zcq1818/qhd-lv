<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="slide-container" style="background:#fff;padding:50px 80px;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <span style="background:#0ea5e9;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">07</span>
    <span style="font-size:14px;color:#0ea5e9;font-weight:700;letter-spacing:2px;">ACCOMMODATION</span>
  </div>
  <h1 style="font-size:36px;font-weight:900;color:#0f172a;margin-bottom:28px;">住宿推荐</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px;">
    <div style="padding:24px;background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border-radius:12px;border-top:4px solid #0ea5e9;">
      <div style="font-size:20px;margin-bottom:12px;">🏨</div>
      <h3 style="font-weight:700;font-size:17px;margin-bottom:8px;">刘庄民宿区</h3>
      <div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:12px;">最方便，步行可达海边<br>周边餐饮超市齐全</div>
      <div style="font-weight:800;font-size:18px;color:#0369a1;">100-600元/晚</div>
      <div style="font-size:12px;color:#64748b;margin-top:4px;">淡季-旺季</div>
    </div>
    <div style="padding:24px;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:12px;border-top:4px solid #d97706;">
      <div style="font-size:20px;margin-bottom:12px;">🌊</div>
      <h3 style="font-weight:700;font-size:17px;margin-bottom:8px;">海景酒店</h3>
      <div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:12px;">设施齐全，服务标准<br>适合情侣或商务</div>
      <div style="font-weight:800;font-size:18px;color:#92400e;">300-1500元/晚</div>
      <div style="font-size:12px;color:#64748b;margin-top:4px;">淡季-旺季</div>
    </div>
    <div style="padding:24px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);border-radius:12px;border-top:4px solid #7c3aed;">
      <div style="font-size:20px;margin-bottom:12px;">✨</div>
      <h3 style="font-weight:700;font-size:17px;margin-bottom:8px;">阿那亚</h3>
      <div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:12px;">高端度假社区<br>文艺气息浓厚</div>
      <div style="font-weight:800;font-size:18px;color:#7c3aed;">1000-3000元/晚</div>
      <div style="font-size:12px;color:#64748b;margin-top:4px;">全年</div>
    </div>
  </div>
  <div style="padding:16px 24px;background:#f0fdf4;border-radius:10px;border:1px solid #bbf7d0;">
    <h4 style="font-weight:700;font-size:15px;color:#166534;margin-bottom:10px;"><i class="fas fa-lightbulb" style="margin-right:8px;color:#16a34a;"></i>住宿省钱技巧</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;font-size:13px;color:#14532d;">
      <div>• 周日-周四价格更低</div>
      <div>• 连住3晚以上有折扣</div>
      <div>• 提前1-2个月预订</div>
      <div>• 民宿比酒店便宜30-50%</div>
      <div>• 直接联系房东更便宜</div>
      <div>• 淡季价格低50%以上</div>
    </div>
  </div>
</div>
<script src="js/weather-widget.js" defer></script>
</body>
</html>
