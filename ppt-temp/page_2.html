<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.slide-container{width:1280px;height:720px;overflow:hidden;position:relative}
.slide-container h1,.slide-container h2,.slide-container p,.slide-container span{margin:0;padding:0}
</style>
</head>
<body>
<div class="slide-container" style="background:#f8fafc;">
  <!-- 左侧标题区 -->
  <div style="position:absolute;top:0;left:0;width:360px;height:720px;background:linear-gradient(180deg,#0c4a6e,#0369a1);padding:60px 40px;display:flex;flex-direction:column;">
    <h1 style="font-size:42px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px;">目录</h1>
    <p style="font-size:16px;color:rgba(255,255,255,0.7);line-height:1.6;">秦皇岛旅游<br>全攻略导览</p>
    <div style="margin-top:auto;color:rgba(255,255,255,0.4);font-size:13px;">CONTENTS</div>
  </div>
  
  <!-- 右侧目录列表 -->
  <div style="position:absolute;top:0;left:360px;width:920px;height:720px;padding:60px 80px;display:flex;flex-direction:column;justify-content:center;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px 60px;">
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">01</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">城市概览</div><div style="font-size:13px;color:#64748b;">秦皇岛在哪里</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">02</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">必玩景点TOP10</div><div style="font-size:13px;color:#64748b;">最值得去的景点</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">03</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">景点门票价格</div><div style="font-size:13px;color:#64748b;">各景点门票汇总</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">04</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">美食推荐</div><div style="font-size:13px;color:#64748b;">海鲜+特色小吃</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">05</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">避坑指南</div><div style="font-size:13px;color:#64748b;">常见陷阱与防坑</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">06</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">交通指南</div><div style="font-size:13px;color:#64748b;">怎么去+市内交通</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">07</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">住宿推荐</div><div style="font-size:13px;color:#64748b;">酒店民宿选择</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #e2e8f0;">
        <span style="background:#0ea5e9;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;">08</span>
        <div><div style="font-weight:700;font-size:17px;color:#0f172a;margin-bottom:4px;">行程规划</div><div style="font-size:13px;color:#64748b;">3天/5天线路</div></div>
      </div>
    </div>
  </div>
</div>
<script src="js/weather-widget.js" defer></script>
</body>
</html>
