/* ================= 卡片着色器:cover 裁切 + 圆角 + 倒影渐隐 ================= */
const CARD_W = 2.2, CARD_H = 3.0, GAP = 0.55;
const N = PICKS.length, STEP = (Math.PI * 2) / N;
const R = (N * (CARD_W + GAP)) / (Math.PI * 2);

const vert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const frag = `
  uniform sampler2D map; uniform float imgAspect; uniform float cardAspect;
  uniform float dim; uniform float reflect; uniform float radius;
  varying vec2 vUv;
  void main(){
    vec2 uv = vUv;
    if (imgAspect > cardAspect) uv.x = (uv.x - 0.5) * cardAspect / imgAspect + 0.5;
    else uv.y = (uv.y - 0.5) * imgAspect / cardAspect + 0.5;
    vec4 c = texture2D(map, uv);
    // 圆角
    vec2 p = (vUv - 0.5) * vec2(${CARD_W.toFixed(2)}, ${CARD_H.toFixed(2)});

    float d = length(max(abs(p) - h, 0.0)) - radius;

    const mat = new THREE.ShaderMaterial({ uniforms: uni(), vertexShader: vert, fragmentShader: frag, transparent: true, side: THREE.DoubleSide });

    const rm = new THREE.Mesh(geo, rmat); rm.position.set(Math.sin(a) * R, -CARD_H - 0.06, Math.cos(a) * R); rm.rotation.y = a; rm.scale.y = -1;

  });
  // 2D 网格
  const gi = document.getElementById('gridIn');
  PICKS.forEach((p, i) => {
    const sp = p.spot, area = data.areas.find(a => a.id === sp.area), cat = data.categories[sp.cat];
    const a = document.createElement('a'); a.className = 'gcard'; a.href = `attraction/${p.id}.html`; a.style.setProperty('--i', i);
    a.innerHTML = `<img src="${p.img}" alt="${sp.name}" loading="lazy"><span class="gn">${String(i + 1).padStart(2, '0')}</span>
      <div class="gi"><div class="gtag" style="--c:${area?.color || '#1a73e8'}"><i></i>${[area?.name, cat?.name].filter(Boolean).join(' · ')}</div>
      <h3>${sp.name}</h3><div class="gm" style="margin-bottom:8px"><span>⭐ <b>${sp.rating ?? '—'}</b></span><span>🎫 ${sp.price || '免费'}</span><span>⏱ ${sp.duration || '2-3小时'}</span></div><button class="trip-btn sm dark" data-trip-add="${p.id}">加入行程</button></div>`;
    gi.appendChild(a);
  });
  // 进度点
  const dots = document.getElementById('dots');
  PICKS.forEach((_, i) => { const d = document.createElement('i'); d.onclick = () => setActive(i); dots.appendChild(d); });
  document.getElementById('total').textContent = String(N).padStart(2, '0');
});

/* ================= 漂浮微粒 ================= */
{

  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: '#bcd9ff', size: 0.05, transparent: true, opacity: .55, depthWrite: false }));
  pts.userData.spin = true; scene.add(pts); scene.userData.pts = pts;
}

/* ================= 状态与交互 ================= */
let active = 0, rot = 0, rotT = 0, vel = 0;
let dragging = false, dragX = 0, dragRot = 0, moved = 0, lastX = 0, lastT = 0;
let idleSince = performance.now(), touched = false;
const mouse = { x: 0, y: 0 };
const cap = document.getElementById('cap');

function setActive(i, instant) {
  active = ((i % N) + N) % N;
  rotT = -active * STEP;

  while (rotT - rot > Math.PI) rotT -= Math.PI * 2;

  const p = PICKS[active], s = p.spot || {};
  const area = DATA?.areas.find(a => a.id === s.area), cat = DATA?.categories[s.cat];
  cap.classList.add('swap');
  setTimeout(() => {
    document.getElementById('cName').textContent = s.name || p.id;
    const tag = document.getElementById('cTag'); tag.querySelector('span').textContent = [area?.name, cat?.name].filter(Boolean).join(' · '); tag.style.setProperty('--c', area?.color || '#1a73e8');
    document.getElementById('cRating').textContent = s.rating ?? '—';
    document.getElementById('cPrice').textContent = s.price || '免费';
    document.getElementById('cDur').textContent = s.duration || '2-3小时';
    document.getElementById('cHl').innerHTML = (s.highlights || []).slice(0, 4).map(h => `<span>${h}</span>`).join('');
    document.getElementById('cGo').href = `attraction/${p.id}.html`;
    const tb = document.getElementById('cTrip'); tb.setAttribute('data-trip-add', p.id); window.dispatchEvent(new CustomEvent('qhd-trip-change', { detail: { ids: window.QhdTrip ? window.QhdTrip.list() : [] } }));
    document.getElementById('cur').textContent = String(active + 1).padStart(2, '0');
    cap.classList.remove('swap');
  }, instant ? 0 : 220);
  // 背景交叉淡入
  const a = document.getElementById('bgA'), b = document.getElementById('bgB');
  const show = bgFlip ? a : b, hide = bgFlip ? b : a; bgFlip = !bgFlip;
  show.style.backgroundImage = `url("${p.img}")`; show.classList.add('on'); hide.classList.remove('on');
  document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === active));
}

/* ================= 2D / 3D 切换 ================= */
let mode = '3d';
function setMode(m, save = true) {
  mode = m;
  stage.classList.toggle('mode-2d', m === '2d');
  document.getElementById('m2d').classList.toggle('on', m === '2d');
  document.getElementById('m3d').classList.toggle('on', m === '3d');
  if (m === '3d') { idleSince = performance.now(); resize(); }
  if (save) { try { localStorage.setItem('qhd-gallery-mode', m); } catch (e) {} }
}
document.getElementById('m2d').onclick = () => setMode('2d');
document.getElementById('m3d').onclick = () => setMode('3d');
try { const saved = localStorage.getItem('qhd-gallery-mode'); if (saved === '2d') setMode('2d', false); } catch (e) {}

const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  dragging = true; touched = true; moved = 0; dragX = lastX = e.clientX; dragRot = rot; lastT = performance.now(); vel = 0;
  stage.classList.add('dragging'); el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  const r = el.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1; mouse.y = ((e.clientY - r.top) / r.height) * 2 - 1;
  if (!dragging) return;
  const dx = e.clientX - dragX; moved = Math.max(moved, Math.abs(dx));
  rot = dragRot + dx / r.width * Math.PI * 1.1; rotT = rot;
  const now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
});
el.addEventListener('pointerup', e => {
  if (!dragging) return; dragging = false; stage.classList.remove('dragging'); idleSince = performance.now();
  if (moved < 6) {                                            // 点击:拾取卡片
    const rc = new THREE.Raycaster(), r = el.getBoundingClientRect();
    rc.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    const hit = rc.intersectObjects(ring.children, false)[0];
    if (hit) { const i = hit.object.userData.i; if (i === active) location.href = `attraction/${PICKS[i].id}.html`; else setActive(i); }
    return;
  }
  const proj = rot + vel * 260 / el.clientWidth * Math.PI;   // 惯性预测后吸附
  setActive(Math.round(-proj / STEP));
});
el.addEventListener('pointercancel', () => { dragging = false; stage.classList.remove('dragging'); setActive(Math.round(-rot / STEP)); });
el.addEventListener('wheel', e => { if (Math.abs(e.deltaY) < 8 && Math.abs(e.deltaX) < 8) return; e.preventDefault(); wheelStep(e.deltaY + e.deltaX); }, { passive: false });
let wheelLock = 0;
function wheelStep(d) { const now = performance.now(); if (now - wheelLock < 500) return; wheelLock = now; touched = true; idleSince = now; setActive(active + (d > 0 ? 1 : -1)); }
addEventListener('keydown', e => { if (mode === '2d') return; if (e.key === 'ArrowRight') { touched = true; idleSince = performance.now(); setActive(active + 1); } if (e.key === 'ArrowLeft') { touched = true; idleSince = performance.now(); setActive(active - 1); } });
document.getElementById('prev').onclick = () => { touched = true; idleSince = performance.now(); setActive(active - 1); };
document.getElementById('next').onclick = () => { touched = true; idleSince = performance.now(); setActive(active + 1); };

/* ================= 渲染 ================= */
let camZ = R + 7.6, camY = 0.4, lookY = -0.85;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, aspect = w / h;
  renderer.setSize(w, h, false); camera.aspect = aspect;
  camera.fov = aspect < 0.8 ? 58 : aspect < 1.2 ? 50 : 42;
  camZ = R + (aspect < 0.8 ? 6.6 : aspect < 1.2 ? 7 : 7.6); camY = aspect < 0.8 ? 0.6 : 0.4; lookY = aspect < 0.8 ? -0.55 : -0.85;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let lastAuto = performance.now();
renderer.setAnimationLoop(now => {
  if (mode === '2d') return;
  // 自动轮播(空闲 6s 后)
  if (!dragging && DATA && loaded === N && now - idleSince > (touched ? 8000 : 4500) && now - lastAuto > 4500) { lastAuto = now; setActive(active + 1); }
  if (!dragging) rot += (rotT - rot) * 0.075;
  ring.rotation.y = mirror.rotation.y = rot;
  // 相机视差
  camera.position.x += ((mouse.x * 0.7) - camera.position.x) * 0.05;
  camera.position.y += ((camY - mouse.y * 0.25) - camera.position.y) * 0.05;
  camera.position.z = camZ;
  camera.lookAt(0, lookY, 0);
  // 卡片明暗 / 缩放
  cards.forEach(c => {
    let d = c.a + rot; d = Math.atan2(Math.sin(d), Math.cos(d));   // 与正前方夹角
    const f = Math.cos(d);
    const dim = THREE.MathUtils.smoothstep(f, -0.1, 1);
    c.mat.uniforms.dim.value = dim; c.rmat.uniforms.dim.value = dim;
    const s = 1 + 0.14 * Math.pow(Math.max(0, f), 10);
    c.m.scale.set(s, s, 1); c.rm.scale.set(s, -s, 1);
    c.m.position.y = (s - 1) * CARD_H * 0.5; c.rm.position.y = -CARD_H - 0.06 - (s - 1) * CARD_H * 0.5;
  });
  const pts = scene.userData.pts; if (pts) { pts.rotation.y = now * 0.00002; pts.position.y = Math.sin(now * 0.0003) * 0.3; }
  renderer.render(scene, camera);
});

document.getElementById('hamburger').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
</script>
