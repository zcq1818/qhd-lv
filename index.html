  var content = data.extract || data.abstract || '';
  var thumbnail = data.thumbnail ? data.thumbnail.source : '';
  var wikiUrl = data.content_urls ? data.content_urls.desktop.page : ('https://zh.wikipedia.org/wiki/' + encodeURIComponent(article.title));
  var lastModified = data.timestamp ? new Date(data.timestamp).toLocaleDateString('zh-CN') : '';
  var wordCount = content.split(/\s+/).length;
  var readTime = Math.max(1, Math.ceil(wordCount / 200));

  card.innerHTML =
    '<div class="wiki-card-header">' +
      '<div class="wiki-card-icon">📖</div>' +
      '<div>' +
        '<div class="wiki-card-title">' + displayTitle + '</div>' +
        '<div class="wiki-card-subtitle">' + (article.subtitle || '') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="wiki-card-content">' +
      (description ? '<p style="margin-bottom: 8px; font-weight: 600; color: var(--text);">' + description + '</p>' : '') +
      content.substring(0, 200) + (content.length > 200 ? '...' : '') +
    '</div>' +
    '<div class="wiki-card-footer">' +
      '<a href="' + wikiUrl + '" target="_blank" rel="noopener" class="wiki-card-link">阅读完整百科</a>' +
      '<span class="wiki-card-meta">' + readTime + ' 分钟阅读</span>' +
    '</div>';

  return card;
}

function showError(message) {
  var container = document.getElementById('wikiContainer');
  container.innerHTML = '<div class="wiki-error"><p>' + message + '</p></div>';
}

async function loadWikipediaContent() {
  var container = document.getElementById('wikiContainer');
  var btn = document.getElementById('wikiRefreshBtn');

  container.innerHTML = '<div class="wiki-loading"><div class="wiki-spinner"></div><p>正在加载百科内容...</p></div>';
  btn.classList.add('loading');
  btn.disabled = true;

  var shuffledArticles = shuffleArray(wikiArticles).slice(0, 3);
  var cards = [];
  var errors = 0;

  for (var i = 0; i < shuffledArticles.length; i++) {
    var article = shuffledArticles[i];
    try {
      var url = getWikipediaUrl(article, 500);
      var response = await fetch(url, {
        headers: {
          'Accept': 'application/json',
          'User-Agent': 'Qinhuangdao-Travel-Guide/1.0 (https://qhd-lv.vercel.app; contact@qhd-lv.com)'
        }
      });

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      var data = await response.json();
      if (data.type === 'disambiguation' || data.type === 'not-found') {
        throw new Error('Article not found');
      }

      cards.push(createWikiCard(article, data));
    } catch (err) {
      console.warn('Failed to load:', article.title, err);
      errors++;
    }
  }

  btn.classList.remove('loading');
  btn.disabled = false;

  if (cards.length === 0) {
    showError('暂时无法加载百科内容，请稍后重试');
    return;
  }

  container.innerHTML = '';
  cards.forEach(function(card) {
    container.appendChild(card);
  });
}

// 页面加载时自动获取内容
document.addEventListener('DOMContentLoaded', function() {
  loadWikipediaContent();
});
</script>
