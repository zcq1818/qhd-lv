  '56': '🌫️', '57': '🌫️', '58': '🌫️', '59': '🌫️',

// 查询天气
async function queryWeather() {
  const location = document.getElementById('location').value;
  
  try {
    const response = await fetch(`/api/weather?location=${location}`);
    const data = await response.json();
    
    if (data.success) {
      displayWeather(data);
    } else {
      alert('获取天气数据失败：' + (data.error || '未知错误'));
    }
  } catch (error) {
    alert('网络错误，请稍后重试');
  }
}

// 显示天气数据
function displayWeather(data) {
  document.getElementById('weatherResult').style.display = 'block';
  
  // 实时天气
  const icon = weatherIcons[data.now.code] || '🌤️';
  document.getElementById('weatherIcon').textContent = icon;
  document.getElementById('nowTemp').textContent = `${data.now.temperature}°`;
  document.getElementById('nowText').textContent = data.now.text;
  document.getElementById('nowFeels').textContent = `${data.now.feelsLike || '--'}°`;
  document.getElementById('nowHumidity').textContent = `${data.now.humidity || '--'}%`;
  document.getElementById('nowWind').textContent = data.now.windDirection || '--';
  document.getElementById('nowVisibility').textContent = `${data.now.visibility || '--'}km`;
  document.getElementById('nowUpdate').textContent = `更新时间：${new Date(data.lastUpdate).toLocaleString('zh-CN')}`;
  
  // 3天预报
  const dailyGrid = document.getElementById('dailyGrid');
  dailyGrid.innerHTML = data.daily.map(d => {
    const dayIcon = weatherIcons[d.textDay === '晴' ? '0' : d.textDay === '多云' ? '2' : '4'] || '🌤️';
    return `
      <div class="weather-daily-item">
        <div class="weather-daily-date">${formatDate(d.date)}</div>
        <div class="weather-daily-icon">${dayIcon}</div>
        <div style="font-size:14px;margin-bottom:4px;">${d.textDay}转${d.textNight}</div>
        <div class="weather-daily-temp">
          <span>${d.high}°</span> / <strong>${d.low}°</strong>
        </div>
      </div>
    `;
  }).join('');
  
  // 生活指数
  const lifeGrid = document.getElementById('lifeGrid');
  const lifeItems = [
    { icon: '☀️', title: '紫外线', value: data.life.uv?.brief || '--' },
    { icon: '👔', title: '穿衣', value: data.life.dressing?.brief || '--' },
    { icon: '😊', title: '舒适度', value: data.life.comfort?.brief || '--' },
    { icon: '🏃', title: '运动', value: data.life.sport?.brief || '--' },
    { icon: '✈️', title: '旅游', value: data.life.travel?.brief || '--' },
    { icon: '🤧', title: '感冒', value: data.life.flu?.brief || '--' }
  ];
  
  lifeGrid.innerHTML = lifeItems.map(item => `
    <div class="weather-life-item">
      <div class="weather-life-icon">${item.icon}</div>
      <div class="weather-life-title">${item.title}</div>
      <div class="weather-life-value">${item.value}</div>
    </div>
  `).join('');
}

// 格式化日期
function formatDate(dateStr) {
  const date = new Date(dateStr);
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  
  if (date.toDateString() === today.toDateString()) return '今天';
  if (date.toDateString() === tomorrow.toDateString()) return '明天';
  
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return `${weekdays[date.getDay()]} ${date.getMonth() + 1}/${date.getDate()}`;
}

// 页面加载时自动查询
window.addEventListener('load', queryWeather);
